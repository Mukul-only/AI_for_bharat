<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#000000"/>
  <!-- Four nodes of the N -->
  <circle cx="30" cy="25" r="5" fill="white"/>
  <circle cx="30" cy="75" r="5" fill="white"/>
  <circle cx="70" cy="25" r="5" fill="white"/>
  <circle cx="70" cy="75" r="5" fill="white"/>
  <!-- Left vertical stroke -->
  <line x1="30" y1="30" x2="30" y2="70" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Diagonal stroke -->
  <line x1="30" y1="30" x2="70" y2="70" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Right vertical stroke -->
  <line x1="70" y1="30" x2="70" y2="70" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
